version: 2
terms:
  - term: mutation tooth
    aliases: [named mutant rule, 突变牙]
    definition: >-
      A durable mutation case consisting of its name, operator, syntax-aware selector and the named test case that must fail; the source range and replacement bytes are derived at run time rather than stored as a copied line.
      一条持久突变用例，由名称、操作符、语法感知选择器及必须失败的具名测试组成；源码范围和替换字节在运行时推导，而不是以复制的源码行保存。
    owner: docs/decisions/implemented/2026-09-24-mutants-are-derived-not-anchored.md
    anchor: Decision
    status: canonical
  - term: "mutation testing"
    aliases: ["变异测试"]
    definition: >-
      Evaluating tests on the original implementation and deliberately altered variants to find changes the tests do not reject; matching a test title alone does not prove behavioral coverage.
      对原始实现和有意改动的变体运行测试，找出测试未拒绝的变更；仅匹配测试标题不证明行为覆盖。
    owner: docs/design/ooo-execution-bootstrap.md
    anchor: "Checkable evidence for a conclusion"
    status: canonical
  - term: test pyramid
    aliases: [test layers, 测试金字塔, 测试分层]
    definition: >-
      Three test layers derived from the boundary a test crosses (unit crosses nothing, integration opens a real database, temp directory or socket, end to end crosses a process boundary), each commanded and measured separately so a tier is judged on the surface it can be thorough about rather than on all of `src`.
      由测试跨过的边界推导出的三层（单元不跨边界，集成打开真实数据库、临时目录或 socket，端到端跨进程边界）；每层可单独运行与度量，使一层按它能做扎实的范围被评估，而不是按整个 `src`。
    owner: docs/design/ci-cd-and-quality.md
    anchor: Test pyramid
    status: canonical

