  - term: promotion gate
    aliases: [promotion criterion, 晋升门槛]
    definition: >-
      Evidence and acceptance conditions that must be met before a research or experimental capability is promoted into a product path.
      将研究或实验能力晋升到产品路径前必须满足的证据与验收条件。
