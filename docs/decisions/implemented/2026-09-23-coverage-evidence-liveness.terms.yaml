terms:
  - term: coverage liveness floor
    aliases: [nonzero coverage floor, 覆盖率存活下限]
    definition: >-
      A minimal measured-coverage threshold that rejects a coverage run with no covered lines; it checks evidence liveness, not coverage quality.
      用于拒绝没有任何覆盖行的覆盖率运行的最小测量阈值；它检查证据是否存在，不评估覆盖质量。
