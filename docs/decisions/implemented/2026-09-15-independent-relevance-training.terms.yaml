terms:
  - term: independent relevance data
    aliases: [independently verified relevance data, 独立相关性数据]
    definition: >-
      Attributable external or independently verified relevance labels with explicit train, calibration and test roles; unknown judgements are excluded rather than converted to negatives.
      可归因的外部或独立验证的相关性标签，具有明确的训练、校准和测试角色；未知判断会被排除，而不是转换为负例。
