version: 2
terms:
  - term: alias/homonym topology gap
    aliases: [labelled alias mentions, alias／同名证据缺口]
    definition: >-
      The evidence gap left by the LoCoMo topology audit and BPID: neither directly contains labelled alias mentions or same-name references to different entities, which is the narrower question the optional Namesakes adapter fills.
      LoCoMo 拓扑审计与 BPID 留下的证据缺口：两者都不直接包含标注好的 alias 提及或指向不同实体的同名引用，而可选的 Namesakes adapter 填补这一更窄的问题。
    owner: docs/experiments/topology/namesakes-evaluation-2026-08-18.md
    anchor: Purpose
    status: canonical
  - term: streaming online-arrival counterfactual
    aliases: [proposal-rate counterfactual, 流式在线到达反事实]
    definition: >-
      Treating each non-anchor mention as one online arrival, reporting how often the score would emit a proposal, and counting the foreign records that would be co-located if wrong proposals were actuated; it quantifies structural co-location damage, not an answer score.
      把每条非 anchor mention 视为一次在线到达，报告该分数会多频繁地发出 proposal，并统计若把错误 proposal actuate 会共置多少外来记录；它量化结构性共置损害，不是答案分数。
    owner: docs/experiments/topology/namesakes-evaluation-2026-08-18.md
    anchor: Protocol
    status: canonical
  - term: paired Agent attribution probe
    aliases: [clean/contaminated attribution arms, 配对 Agent 归因探针]
    definition: >-
      A fixed downstream probe that forms a `clean` arm from up to three `Same` mention contexts and a `contaminated` arm by appending one record from a different official entity row, then asks the Agent which opaque IDs belong to the target entity; labels are never shown, arm order is counterbalanced, and responses are cached by content.
      固定的下游探针：用最多三条 `Same` mention 上下文构成 `clean` 组，再追加一条来自不同官方实体行的记录构成 `contaminated` 组，然后让 Agent 返回它归因给目标实体的不透明 ID；标签从不展示，组顺序被平衡，响应按内容缓存。
    owner: docs/experiments/topology/namesakes-evaluation-2026-08-18.md
    anchor: Paired Agent attribution probe
    status: canonical
  - term: threshold curve without a usable operating point
    aliases: [non-monotonic precision curve, 无可用工作点的阈值曲线]
    definition: >-
      The reported Namesakes curve in which the four sampled thresholds did not demonstrate a safe automatic-acceptance precision/recall operating point. It motivates review-only candidate nomination, not a theorem about every score or threshold configuration.
      报告中的 Namesakes 曲线；四个样本阈值未证明可安全自动接受身份的 precision／recall 工作点。它为仅提名待审候选提供动机，不是关于所有分数或阈值配置的定理。
    owner: docs/experiments/topology/namesakes-evaluation-2026-08-18.md
    anchor: Full official-data result (2026-08-11)
    status: canonical
  - term: invalid same-page contamination pilot
    aliases: [withdrawn 90%-to-20% drop, 已作废的同页污染 pilot]
    definition: >-
      The earlier apparent 90%-to-20% decline, withdrawn because paragraphs around `Other` mentions on the target page could still describe the target. The corrected protocol required foreign records from another entity page; the invalid pilot is not evidence of downstream harm.
      早先表面上 90% 到 20% 的下降，因目标页面上 `Other` mention 周围段落仍可能描述目标而作废。修正协议要求来自另一实体页面的外来记录；无效 pilot 不是下游损害证据。
    owner: docs/experiments/topology/namesakes-evaluation-2026-08-18.md
    anchor: Paired Agent result (2026-08-11)
    status: canonical
references: []
