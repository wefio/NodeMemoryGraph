    aliases: [header refinement, 仅格式的 recall-header 变更]
    definition: >-
      A historical recall-header format refinement for which the report recorded unchanged bridge retrieval metrics; because the bridge bypassed `formatSearchHeaders`, that comparison did not validate the changed Pi renderer.
      历史 recall-header 格式精化；报告记录了不变的 bridge 检索指标，但 bridge 绕过了 `formatSearchHeaders`，因此该对比没有验证改动后的 Pi renderer。
    owner: docs/experiments/benchmarks/lme-recall-headers-2026-08-04.md
