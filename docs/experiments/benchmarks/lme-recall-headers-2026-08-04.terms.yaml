    status: canonical
  - term: version-keyed store pruning
    aliases: [--prune-stores, version-keyed store cleanup, 按 version 清理 store]
    definition: >-
      Cleanup of version-keyed evaluation stores in the historical full-500 workflow: the report describes `sha256(userId)` keys incorporating the version label and roughly 500 new ~12 MB stores per such run, not a universal cost for every NMG caller.
      历史完整 500 题流程中按 version 清理评测 store；报告描述的 `sha256(userId)` key 包含 version label，每次该类 run 约产生 500 个约 12 MB 的新 store，不是所有 NMG 调用方的通用成本。
    owner: docs/experiments/benchmarks/lme-recall-headers-2026-08-04.md
