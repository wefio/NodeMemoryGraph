apiVersion: repository.nmg.dev/v1alpha1
kind: AgentChange
metadata:
  id: repository-control-plane-implementation
spec:
  intent: Complete the external run-to-completion Repository Control Plane without moving repository authority into NMG
  scope:
    include:
      - .gitignore
      - .rcp/contracts/**
      - agent-context.yaml
      - bin/nmg-rcp.mjs
      - docs/decisions/implemented/2026-08-29-repository-control-plane.md
      - docs/decisions/implemented/2026-08-29-repository-control-plane.zh-CN.md
      - docs/design/ci-cd-and-quality.md
      - docs/design/completion-audit.md
      - docs/design/temporary-todo.md
      - package.json
      - src/rcp/**
      - tests/rcp/**
      - tests/tools/agent-verify.test.ts
      - tools/agent-verify.ts
      - tools/repo-context.ts
      - tools/verify-package.ts
      - tsconfig.build.json
    exclude:
      - docs/experiments/**
      - evals/**
  preserve:
    - NMG daemon and Core do not depend on or own the Repository Control Plane
    - experiments remain non-normative and non-blocking
    - unrelated working-tree changes remain untouched
  assertions:
    - id: plan-mode-default
      statement: Plan mode emits a WorkOrder without executing or recording
      check: "node-test:repository-control-plane#plan mode emits a WorkOrder without executing or recording"
      kind: test
      stage: unit
    - id: apply-requires-harness-boundary
      statement: Apply is fail-closed without an explicit harness boundary
      check: "node-test:repository-control-plane#CLI apply is fail-closed without an explicit harness boundary"
      kind: test
      stage: unit
    - id: harness-cannot-self-certify
      statement: An implementing harness cannot weaken its verifier during execution
      check: "node-test:repository-control-plane#an implementing harness cannot weaken its verifier during execution"
      kind: test
      stage: unit
    - id: truth-domains-separate
      statement: RCP core remains outside NMG Core, daemon and integration boundaries
      check: "node-test:repository-control-plane#RCP core remains outside NMG Core, daemon and integration boundaries"
      kind: test
      stage: integration
    - id: failed-attempts-append-only
      statement: Failed attempts remain append-only without preventing a later retry
      check: "node-test:repository-control-plane#failed attempts remain append-only without preventing a later retry"
      kind: test
      stage: unit
  verification:
    routes:
      - ci-and-tests
      - packaging
      - repository-control-plane
      - repository-tooling
    checks:
      - agent:context:check
      - build
      - check
      - docs:check
      - glossary:check
      - package:check
      - rtm:check
      - test:product
    forgeChecks:
      - All checks passed
  authority:
    mode: apply
  extensions:
    repository.nmg.dev/delivery:
      kind: run-to-completion
      continuousWatcher: deferred-until-needed
