# ============================================
# NMG 提示词单一来源 (single source of truth)
# --------------------------------------------
# 修改此处即可生效：重启 daemon（Pi 扩展）或重跑评测桥即可，无需改代码。
#
# 各部分说明：
#   *_description  —— 工具描述。LLM 决定是否调用工具时看到。保持中立：
#                     只说明工具做什么、返回什么、存什么，不指示何时调用。
#   *_parameter_description —— 工具参数说明。解释参数语义与协议后果；
#                     参数类型、必填性、枚举和数值范围仍由 TypeBox 定义。
#   *_disclosure   —— 渐进披露。工具返回结果时附带的使用说明（只解释
#                     数据格式与下一步操作，不指示回答策略）。
#   memory_policy  —— 注入 system prompt 的 NMG 使用策略（Pi 扩展用）。
#
# 占位符（运行时由代码替换，勿删）：
#   {count}        —— 返回记录条数
#   {next_step}    —— 下一步操作提示（有折叠记录时是 L1 continuation 说明）
#   {forget_hint}  —— 出现 [forget] 标记时的撤销边界说明（否则留空）
# ============================================

# ---- 工具描述 ------------------------------------------------------------

search_description: >-
  Search long-term memory. Queries match saved records by literal terms,
  semantic similarity, and learned graph routes; returns ranked candidate
  headers (memory id, node, type, match terms, event date, preview) plus an
  activeGraphId. Exact records and source evidence are loaded via nmg_get.
  The store only contains what was explicitly saved - it is not a live
  source. Advanced syntax: key:value filters (type:preference,constraint
  node:"Conversation ..." state:key time:2026-01-01..2026-06-30), -term
  exclusions, and quoted phrases.

get_description: >-
  Load exact memory records and source evidence for memory IDs returned by
  nmg_search (or nmg_automatic_recall). When available, pass the activeGraphId
  returned by search so NMG can attribute actual use; it is not required to
  read a known memory ID. Returns the full statement plus evidence content and
  source reference.

remember_description: >-
  Save a durable record (fact, state, event, preference, constraint,
  strategy), resolve a possible supersession, or attach explicit evaluation
  feedback to a retrieval trace.
  You decide the semantic content and whether a candidate is truly an older
  value; NMG validates scope, identity, provenance, and applies the transaction.
  The record persists across sessions. Only save attributable information -
  not secrets, transient content, or unsupported guesses. A stateKey names one
  replaceable property within a stable scope; it is not a topic or grouping tag.

remember_action_parameter_description: >-
  Omit or use save for a new memory. Use supersede only when a candidate is the
  older value of the new memory. Use relate to propose a semantic relationship
  without merging node identity; the proposal remains reversible and pending.
  Use forget only when the user explicitly asks to withdraw a selected memory.
  Use feedback to record explicit task/retrieval labels for an activeGraphId;
  silence or lack of correction is not positive feedback.

remember_memory_id_parameter_description: >-
  For action=forget, the exact memory ID to withdraw from normal retrieval.
  This creates an auditable logical deletion, not physical privacy erasure.

remember_new_memory_id_parameter_description: >-
  For action=supersede, the new memory ID returned by the preceding save.

remember_superseded_memory_id_parameter_description: >-
  For action=supersede, the candidate memory ID whose value is replaced. Do not
  use this merely because two memories are related or similar.

remember_related_memory_id_parameter_description: >-
  For action=relate, a candidate memory ID whose node has a meaningful semantic
  relationship with the newly saved memory. This does not merge either node.

remember_relation_judgement_parameter_description: >-
  For action=relate, classify the nodes as same_entity, related, refines,
  conflict, or distinct. Use same_entity only for identity, not similarity;
  use distinct when an apparent match is actually a different entity or scope.

node_name_parameter_description: >-
  Stable semantic cluster name. Related memories may share a node even when
  they describe different properties.

state_key_parameter_description: >-
  Stable key for exactly one replaceable property within scope. Good:
  pi-lsp.installation.path. Bad: pi-lsp-env used for installation path, tool
  inventory, and patch policy. A newer state with the same key and canonical
  scope automatically supersedes the previous active state, so a broad key can
  incorrectly retire an unrelated state.

external_source_parameter_description: >-
  External provenance reference beginning with web: or file:.

evidence_parameter_description: >-
  Smallest exact excerpt that supports the saved statement. Copy it from the
  user, assistant, or tool source identified by sourceActor; do not summarize
  or include surrounding routine prose. Pi binds a matching excerpt to its
  source message. Use externalSource for web/file evidence.

active_graph_id_parameter_description: >-
  Optional activeGraphId returned by nmg_search. Pass it when available to
  attribute actual memory use; it is not required to read a known memory ID.

feedback_note_parameter_description: >-
  Optional concise reason for an explicit retrieval/task label. Do not include
  hidden reasoning, secrets, or infer success merely because no correction was made.

feedback_label_parameter_description: >-
  Explicit observed label for action=feedback. Omit when unknown; false means
  the condition was actually reviewed and absent, not merely that nobody said it.

semantic_task_id_parameter_description: >-
  Optional stable identifier shared by retries of the same semantic task. It is
  used for calibration deduplication, not session authorization or memory scope.

search_query_parameter_description: >-
  Natural-language retrieval clause; may include key:value filters, -term
  exclusions, and quoted phrases.

search_queries_parameter_description: >-
  Additional retrieval clauses unioned with the primary query; the primary
  query retains rank priority.

search_progression_required: >-
  NMG paused another search because two searches were already completed without
  loading selected evidence. Use nmg_get on relevant returned memory IDs, or use
  a current-source tool when the missing fact concerns live code, files, or the
  web. Do not keep paraphrasing the same historical search.

# ---- 完成提醒（弱提示——commit/任务完成后注入，不强制） ------------------
completion_nudge: >-
  A code commit or task completion was just detected. NMG long-term memory is
  available: you may recall relevant decisions (nmg_search) or save this
  turn's key conclusions (nmg_remember) if useful. This is only a reminder;
  it does not affect the current work.

# ---- 渐进披露（检索结果返回时附带） ---------------------------------------

search_disclosure: |
  NMG memory search results: {count} candidate record(s).
  Each line is one memory record, optionally prefixed by [event date] and [marker] tags.
  Records are ranked by retrieval score; order is not a guarantee of relevance.
  {next_step}
  {forget_hint}

# MCP (Claude Code plugin) variant: the renderer emits compact tab-separated
# headers (mid/node/type/L/preview), so the format line describes that layout.
mcp_search_disclosure: |
  NMG memory search results: {count} candidate header(s).
  Each line: mid=memory id; node=cluster; type=memory type; L{tier}; statement preview.
  Records are ranked by retrieval score; order is not a guarantee of relevance.
  {next_step}
  {forget_hint}

get_disclosure: |
  NMG evidence for {count} selected record(s):
  - statement: the saved record content
  - SOURCE=: original evidence content when it differs from the statement
  - id/node/type/truth/scope identify the record
  {next_step}

deferred_hint: >-
  More ranked records are folded. If these are insufficient, call nmg_get
  once with the deferred memory IDs; do not repeat nmg_search.

get_hint: >-
  Use nmg_get with selected memory IDs and the activeGraphId to load exact
  records and source evidence.

forget_hint: >-
  A line beginning with [forget] is a revocation boundary; treat it as
  revoked.

# Rendered in place of a revoked record's statement in search results
# (auto-recommendation). Metadata (id, type, time) stays visible on the
# line; only the statement content is withheld.
forget_redacted: "[forget] (content withdrawn)"

# ---- 其他 -----------------------------------------------------------------

headers_fields: |-
  fields: memory=id; node=memory cluster; type=memory type; matches=query terms hit, else semantic/graph/hybrid; time=event date; expires=expiry date; preview=statement excerpt

# Section titles injected by the Pi extension (LLM-visible format labels).
headers_title: "NMG SEARCH HEADERS"
in_context_title: "NMG ALREADY IN CURRENT CONTEXT"

memory_policy: >-
  NMG supplies durable memory; it does not decide answer truth or evidence completeness.
  nmg_automatic_recall and nmg_search return candidate headers. nmg_get loads selected
  exact records and source evidence. nmg_remember saves durable information. Automatic
  recall uses a bounded current-task context, but can still miss a relevant domain. For
  the latest user request, decide which candidates matter, whether one or several records
  are needed, and whether more recall or current verification is required. If the current
  task clearly depends on prior project state and automatic headers are absent or
  insufficient, use nmg_search before guessing; this is not a requirement to search on
  every turn. NMG is historical memory, not a live code/file/web source: after one
  deliberate search and selected get fail to supply the missing fact, stop reformulating
  the same request and either use an appropriate current-source tool or state that the
  current fact was not verified. No useful memory is a valid result. Do not treat candidate count as completeness or a memory as
  current truth. If the recalled headers under-determine the answer, request additional
  evidence (append/re-fetch) before guessing; ignore headers that are clearly irrelevant
  noise. Save only attributable, durable information; do not save secrets, transient
  content, unconfirmed assistant proposals, or unsupported guesses.
