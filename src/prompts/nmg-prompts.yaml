# ============================================
# NMG 提示词单一来源 (single source of truth)
# --------------------------------------------
# 修改此处即可生效：重启 daemon（Pi 扩展）或重跑评测桥即可，无需改代码。
#
# 各部分说明：
#   *_description  —— 工具描述。LLM 决定是否调用工具时看到。保持中立：
#                     只说明工具做什么、返回什么、存什么，不指示何时调用。
#   *_parameter_description —— 工具参数说明。解释参数语义与协议后果；
#                     参数类型、必填性、枚举和数值范围仍由 TypeBox 定义。
#   *_disclosure   —— 渐进披露。工具返回结果时附带的使用说明（只解释
#                     数据格式与下一步操作，不指示回答策略）。
#   memory_policy  —— 注入 system prompt 的 NMG 使用策略（Pi 扩展用）。
#
# 占位符（运行时由代码替换，勿删）：
#   {count}        —— 返回记录条数
#   {next_step}    —— 下一步操作提示（有折叠记录时是 L1 continuation 说明）
#   {forget_hint}  —— 出现 [forget] 标记时的撤销边界说明（否则留空）
# ============================================

# ---- 工具描述 ------------------------------------------------------------

search_description: >-
  Search long-term memory. Queries match saved records by literal terms,
  semantic similarity, and learned graph routes; returns ranked candidate
  headers (memory id, node, type, match terms, event date, preview) plus an
  activeGraphId. Exact records and source evidence are loaded via nmg_get.
  The store only contains what was explicitly saved - it is not a live
  source. Advanced syntax: key:value filters (type:preference,constraint
  node:"Conversation ..." state:key time:2026-01-01..2026-06-30), -term
  exclusions, and quoted phrases.

get_description: >-
  Load exact memory records and source evidence for memory IDs returned by
  nmg_search (or nmg_automatic_recall). When available, pass the activeGraphId
  returned by search so NMG can attribute actual use; it is not required to
  read a known memory ID. Returns the full statement plus evidence content and
  source reference.

remember_description: >-
  Save a durable record (fact, state, event, preference, constraint,
  strategy), resolve a possible supersession, attach explicit evaluation
  feedback to a retrieval trace, or record an attributable supported/contradicted
  outcome for selected saved claims.
  You decide the semantic content and whether a candidate is truly an older
  value; NMG validates scope, identity, provenance, and applies the transaction.
  The record persists across sessions. Only save attributable information -
  not secrets, transient content, or unsupported guesses. Never label an
  Assistant inference as a user statement. A stateKey names one
  replaceable property within a stable scope; it is not a topic or grouping tag.

board_description: >-
  Coordinate through a temporary blackboard shared by NMG clients. Without a
  taskId, entries land on the shared world channel; reading it lists active
  named channels you can join by name. Entries expire automatically and retain
  writer attribution (NMG_AGENT_ID). Use put/read/resolve; full conventions
  (memory pointers, boundaries) are disclosed in each tool result.

reason_description: >-
  Maintain a session-private, auditable reasoning scratchpad containing typed
  goals, observations, hypotheses, evidence, conclusions, decisions, open
  questions, next actions, and explicit relations. It persists checkpoints
  across Pi compaction and process restart but never writes scratch content into
  durable semantic memory.

reason_action_parameter_description: >-
  add creates one typed scratch node; update changes one existing node; link
  records one explicit relation; checkpoint returns a bounded current view;
  clear deletes only this session's reasoning scratchpad.

reason_node_id_parameter_description: >-
  Stable reasoning-node ID returned by an earlier nmg_reason call. Required for
  update and scoped to the current Pi session.

reason_kind_parameter_description: >-
  The role of a new scratch node in the current reasoning process. Required for
  add; it is not a durable MemoryNode type.

reason_content_parameter_description: >-
  Concise scratch content for add, or replacement content for update. Keep
  uncertainty explicit; scratch content is not verified fact.

reason_status_parameter_description: >-
  Epistemic or workflow status of the scratch node. supported means the node has
  traceable support; rejected preserves a disproven path; resolved and
  superseded keep lifecycle history.

reason_importance_parameter_description: >-
  Session-local checkpoint priority from 0 to 1. It affects bounded disclosure,
  not truth, durability, or automatic promotion.

reason_evidence_refs_parameter_description: >-
  Optional stable references supporting a new scratch node, such as NMG memory
  IDs, source-message IDs, file locations, or tool-result identities. References
  are retained for audit but are not independently verified by this tool.

reason_source_id_parameter_description: >-
  Existing reasoning-node ID at the source of a relation. Required for link.

reason_target_id_parameter_description: >-
  Existing reasoning-node ID at the target of a relation. Required for link.

reason_relation_parameter_description: >-
  Explicit directed relation between two existing scratch nodes. Required for
  link and scoped to the current Pi session.

board_action_parameter_description: >-
  Use put to publish one concise coordination entry, read to fetch entries after
  an optional cursor, claim to take an open entry as the single working Agent
  (lease-based; expired claims return to the pool, resolving clears the claim),
  release to put a claimed entry back, unsubscribe to leave a channel (stop
  receiving its wake notices; the world channel is your default member channel
  and can be muted the same way), subscribe to join a channel (topic-based
  membership — a named channel only wakes its members, never non-members),
  acknowledge to record that you have seen and accepted an entry and owe no
  reply (pure state write — no broadcast, no wake, and the acked entry stops
  re-notifying you), or resolve to close a selected entry.
  discover lists online agents (A2A roster, by capability) so you can pick a
  target, then put ... to=<stable agent_name> for directed delivery — only that
  agent's LLM is woken, everyone else reads but stays silent (find first via
  discover, then direct). Un-directed actionable entries (handoff/question/
  blocker) are serialised per channel: only one outstanding is pushed at a
  time; later ones sit 'pending' (read-visible, silent) until the outstanding
  one is claimed (接手=回复) or resolved, which promotes the next. Directed
  entries are exempt (parallel-safe).
  kind decides wake routing: question/blocker/handoff ask for a response and
  WAKE subscribers; note/result/decision/goal are notify-only and SILENT (they
  record a fact, owe no reply, and are read on demand — never pushed). If you
  need an answer or action, use question/handoff; never smuggle a request into
  a note (a silent note asking for something starves). When a fact is already
  confirmed, do not post a confirming note — acknowledge it (one ack is
  enough; everyone confirming one fact is an acknowledgement storm).
  Confirmations close: once a question/handoff is answered, resolve it — a
  resolved entry is closed and should not be replied to (reopen only for new
  substance). Acknowledgement is the lightweight "确认但不用回": for a
  result/note you accept, prefer acknowledge over posting a new reply entry —
  acknowledgers are visible in read output (✅ acked by ...) and readers check
  them on demand instead of being broadcast every Ack. Put/read/claim/release/
  resolve/acknowledge do not create semantic memory.
  To persist a board conclusion as durable memory WITHOUT duplicating it:
  (1) nmg_search first — if the fact already exists as a memory, do not
      remember it again; point the board entry at it with memory=<id>.
  (2) only if no existing memory covers it, nmg_remember with
      boardSource: {taskId, entryId} (records a board_origin marker so the
      memory traces back to this board entry and later dedup can recognize
      it). (3) resolve the board entry once the memory is created, noting
      memory=<id> in the resolution.

remember_board_source_parameter_description: >-
  Provenance link from a task board entry to the durable memory being created
  from its content. When set, nmg_remember attaches a board_origin marker
  ({kind: "board_origin", attributes: {taskId, entryId}}) so the memory
  traces back to the board entry and later writes of the same board content
  can be recognized as duplicates. Use it ONLY when creating a NEW memory
  from board content that has no existing memory counterpart (search first).

board_task_id_parameter_description: >-
  Optional. Name of the channel to read or write. When omitted, entries land on
  the shared world channel (the default), which every Agent reads; reading the
  world channel also lists active named channels so you can discover and join
  one by name.

board_content_parameter_description: >-
  Concise task coordination state such as a goal, blocker, result, handoff,
  question, or decision. Do not include secrets or hidden chain-of-thought.
  To point other Agents at durable knowledge, include memory=<id> references
  (the same format automatic recall uses); readers expand them with nmg_get.

remember_action_parameter_description: >-
  Omit or use save for a new memory. Use supersede only when a candidate is the
  older value of the new memory. Use relate to propose a semantic relationship
  without merging node identity; the proposal remains reversible and pending.
  Use forget only when the user explicitly asks to withdraw a selected memory.
  Use resolve when an open question or dependency has been settled. Use reopen
  when later evidence makes a resolved memory actionable again; provide the
  related evidence memory IDs so the open structure stays attributable.
  Use feedback to record explicit task/retrieval labels. Use claim_outcome only
  after an attributable user, tool, or completed task explicitly supports or
  contradicts selected saved claims; retrieval, use, silence, and task success
  alone are not claim outcomes. Pass activeGraphId when
  labelling a specific older retrieval; omit it only to label the latest retrieval
  in the current Pi session. Silence or lack of correction is not positive feedback.

remember_memory_id_parameter_description: >-
  For action=forget, resolve, or reopen, the exact target memory ID.
  This creates an auditable logical deletion, not physical privacy erasure.

remember_new_memory_id_parameter_description: >-
  For action=supersede, the new memory ID returned by the preceding save.

remember_superseded_memory_id_parameter_description: >-
  For action=supersede, the candidate memory ID whose value is replaced. Do not
  use this merely because two memories are related or similar.

remember_related_memory_id_parameter_description: >-
  For action=relate, a candidate memory ID whose node has a meaningful semantic
  relationship with the newly saved memory. This does not merge either node.

remember_relation_judgement_parameter_description: >-
  For action=relate, classify the nodes as same_entity, related, refines,
  conflict, or distinct. Use same_entity only for identity, not similarity;
  use distinct when an apparent match is actually a different entity or scope.

node_name_parameter_description: >-
  Stable semantic cluster name. Related memories may share a node even when
  they describe different properties.

state_key_parameter_description: >-
  Stable key for exactly one replaceable property within one canonical scope.
  Reuse the key when the new value makes the old value no longer current; for
  example, running.charity_5k.personal_best changes from 27:12 to 25:50. Use
  different keys when both values can remain true; for example, a personal best
  and a target time are distinct properties. Good: pi-lsp.installation.path.
  Bad: pi-lsp-env used for installation path, tool inventory, and patch policy.
  A newer state with the same key and canonical scope automatically supersedes
  the previous active state, so a broad or wrongly reused key can incorrectly
  retire an unrelated state.

external_source_parameter_description: >-
  External provenance reference beginning with web: or file:.

evidence_parameter_description: >-
  Smallest exact excerpt that supports the saved statement. Copy it from the
  user, assistant, or tool source identified by sourceActor; do not summarize
  or include surrounding routine prose. Pi binds a matching excerpt to its
  source message. Use externalSource for web/file evidence.

source_actor_parameter_description: >-
  Author of the supporting evidence, not the desired authority of the memory.
  Omit only for Assistant-created content (the safe default). Use user, tool,
  or system only with an exact evidence excerpt from that source in the current
  Pi session, or with an explicit externalSource for tool-derived web/file
  evidence. Never mark an Assistant inference or summary as sourceActor=user.

active_graph_id_parameter_description: >-
  Optional activeGraphId returned by nmg_search. For action=feedback, omit it to
  target the latest retrieval owned by the current Pi session; pass it to label a
  specific older retrieval. For nmg_get, pass it when available to attribute use.

feedback_note_parameter_description: >-
  Optional concise reason for an explicit retrieval/task label. Do not include
  hidden reasoning, secrets, or infer success merely because no correction was made.

feedback_label_parameter_description: >-
  Explicit observed label for action=feedback. Omit when unknown; false means
  the condition was actually reviewed and absent, not merely that nobody said it.

semantic_task_id_parameter_description: >-
  Optional stable identifier shared by retries of the same semantic task. It is
  used for calibration deduplication, not session authorization or memory scope.

search_query_parameter_description: >-
  Natural-language retrieval clause; may include key:value filters, -term
  exclusions, and quoted phrases.

search_queries_parameter_description: >-
  Additional retrieval clauses unioned with the primary query; the primary
  query retains rank priority.

search_progression_required: >-
  NMG paused another search because two searches were already completed without
  loading selected evidence. Use nmg_get on relevant returned memory IDs, or use
  a current-source tool when the missing fact concerns live code, files, or the
  web. Do not keep paraphrasing the same historical search.

search_recommendation: >-
  Automatic recall may be incomplete ({reason}; confidence={qpp}). If prior
  experience could change the answer, make one deliberate nmg_search call and
  then inspect only useful IDs with nmg_get.

# ---- 完成提醒（弱提示——commit/任务完成后注入，不强制） ------------------
completion_nudge: >-
  A code commit or task completion was just detected. NMG long-term memory is
  available: you may recall relevant decisions (nmg_search) or save this
  turn's key conclusions (nmg_remember) if useful. This is only a reminder;
  it does not affect the current work.

# Shadow-only, one-shot reminder on the turn after a retrieval outcome.
shadow_feedback_nudge: >-
  The previous NMG retrieval activeGraphId={active_graph_id} has completed and
  remains unlabelled. If the preceding answer and tool evidence let you review
  it, call nmg_remember action=feedback with semanticTaskId={semantic_task_id}
  and explicit values for evidenceSufficient, expansionUseful, excessiveNoise,
  and noMemoryNeeded. Omit the feedback call when any required label would be a
  guess. Silence, task completion, and lack of user correction are not labels.

# ---- 渐进披露（检索结果返回时附带） ---------------------------------------

search_disclosure: |
  NMG memory search results: {count} candidate record(s).
  Each line is one memory record, optionally prefixed by [event date] and [marker] tags.
  Records are ranked by retrieval score; order is not a guarantee of relevance.
  {next_step}
  {forget_hint}

# MCP (Claude Code plugin) variant: the renderer emits compact tab-separated
# headers (mid/node/type/L/preview), so the format line describes that layout.
mcp_search_disclosure: |
  NMG memory search results: {count} candidate header(s).
  Each line: mid=memory id; node=cluster; type=memory type; L{tier}; statement preview.
  Records are ranked by retrieval score; order is not a guarantee of relevance.
  {next_step}
  {forget_hint}

get_disclosure: |
  NMG evidence for {count} selected record(s):
  - statement: the saved record content
  - SOURCE=: original evidence content when it differs from the statement
  - id/node/type/truth/scope identify the record
  {next_step}

deferred_hint: >-
  More ranked records are folded. If these are insufficient, call nmg_get
  once with the deferred memory IDs; do not repeat nmg_search.

get_hint: >-
  Use nmg_get with selected memory IDs and the activeGraphId to load exact
  records and source evidence.

forget_hint: >-
  A line beginning with [forget] is a revocation boundary; treat it as
  revoked.

# Rendered in place of a revoked record's statement in search results
# (auto-recommendation). Metadata (id, type, time) stays visible on the
# line; only the statement content is withheld.
forget_redacted: "[forget] (content withdrawn)"

# ---- 其他 -----------------------------------------------------------------

headers_fields: |-
  fields: memory=id; node=memory cluster; type=memory type; matches=query terms hit, else semantic/graph/hybrid; time=event date; expires=expiry date; preview=statement excerpt

# Section titles injected by the Pi extension (LLM-visible format labels).
headers_title: "NMG SEARCH HEADERS"
in_context_title: "NMG ALREADY IN CURRENT CONTEXT"

memory_policy: >-
  NMG supplies durable memory; it does not decide answer truth or evidence completeness.
  nmg_automatic_recall and nmg_search return candidate headers. nmg_get loads selected
  exact records and source evidence. nmg_remember saves durable information. Automatic
  recall uses a bounded current-task context, but can still miss a relevant domain. For
  the latest user request, decide which candidates matter, whether one or several records
  are needed, and whether more recall or current verification is required. If the current
  task clearly depends on prior project state and automatic headers are absent or
  insufficient, use nmg_search before guessing; this is not a requirement to search on
  every turn. NMG is historical memory, not a live code/file/web source: after one
  deliberate search and selected get fail to supply the missing fact, stop reformulating
  the same request and either use an appropriate current-source tool or state that the
  current fact was not verified. No useful memory is a valid result. Do not treat candidate count as completeness or a memory as
  current truth. If the recalled headers under-determine the answer, request additional
  evidence (append/re-fetch) before guessing; ignore headers that are clearly irrelevant
  noise. Save only attributable, durable information; do not save secrets, transient
  content, unconfirmed assistant proposals, or unsupported guesses.

claim_outcome_parameter_description: >-
  Explicit result for selected saved claims: supported or contradicted. This is
  evidence about the claim itself, not retrieval quality. Never infer support
  merely because a memory was retrieved, used in an answer, or not corrected.

claim_outcome_source_parameter_description: >-
  Attribution class for the outcome: user, tool, or task. User/tool outcomes
  require an exact evidence excerpt from the current Pi session; task outcomes
  require claimSourceLineage. Benchmark outcomes are reserved for eval/CLI.

claim_source_lineage_parameter_description: >-
  Stable identity of an independently attributable completed task. For
  user/tool outcomes Pi derives lineage from the exact evidence message instead
  of trusting a model-provided ID. Reusing lineage prevents one source from
  becoming multiple independent votes.

claim_indexes_parameter_description: >-
  Optional zero-based indexes of atomic claims within the memory. Omit to apply
  the explicit outcome to every claim in that memory.
