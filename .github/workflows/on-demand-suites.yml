name: On-demand suites

# Runs the test suites that no CI job reaches, on both platforms, only when asked for.
#
# Two reasons this is a separate workflow rather than another job in ci.yml:
#   - The set is derived, not chosen: `npm run ci:uncovered-tests --list` prints the suites that
#     no job globs reach, so a future suite is picked up here automatically instead of being
#     forgotten. The static job's `--check` mode fails when such a suite appears outside an
#     acknowledged root, so it cannot land silently either.
#   - These suites drive real git worktrees, real child processes and real multi-process
#     boards, and the two flakes observed so far were load-sensitive. They run at bounded
#     concurrency, and they are not required checks while that is still true.
#
# The platforms are not decoration: the cancellation machinery has a POSIX branch (a detached
# process group killed with `process.kill(-pid)`) and a Windows branch (`taskkill /T`). On Windows
# libuv's job object reaps the children anyway, so only a Linux runner can measure the POSIX
# branch at all.
on:
  # A `workflow_dispatch` workflow only becomes dispatchable once its file exists on the default
  # branch, so the pull request that adds this one cannot trigger it. The first real run — and with
  # it the Linux half of the cancellation claim, which no other runner can measure — happens after
  # merge: `gh workflow run on-demand-suites.yml`.
  workflow_dispatch:

concurrency:
  group: on-demand-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uncovered:
    name: Unreached suites (${{ matrix.os }})
    strategy:
      # One platform failing must not hide the other's result, which is the whole point of the
      # matrix here.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Which suites does CI not reach
        shell: bash
        run: |
          echo "### Unreached suites" >> "$GITHUB_STEP_SUMMARY"
          npm run ci:uncovered-tests
          node --experimental-strip-types tools/ci-uncovered-tests.ts --list > unreached.txt
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          cat unreached.txt >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Run them, one file at a time
        shell: bash
        # `pipefail` so the TAP tee cannot mask a failing suite; bounded concurrency because the
        # flakes seen so far were load-sensitive.
        #
        # The comparison suite prints its measurements as `[ooo-compare]` lines and, when
        # `NMG_OOO_ARTIFACT_DIR` is set, copies the bytes it asserted on out of its temporary
        # directory — so the uploaded `compare.json` and arm logs are the measured artifacts, not
        # a re-derivation from the transcript.
        env:
          NMG_OOO_ARTIFACT_DIR: ${{ github.workspace }}/ooo-artifacts
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-concurrency=1 \
            --test-reporter=tap $(tr '\n' ' ' < unreached.txt) \
            | tee "unreached-${{ matrix.os }}.tap"
      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreached-suites-${{ matrix.os }}
          path: |
            unreached-${{ matrix.os }}.tap
            ooo-artifacts/
          # The transcript is required evidence: a run that produced none tells us nothing. The
          # comparison artifacts are a convenience copy and only exist if that suite ran.
          if-no-files-found: error
          retention-days: 7
