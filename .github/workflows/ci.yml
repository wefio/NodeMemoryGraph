name: CI

# Scope: keyless, self-contained checks only. Everything that needs API keys or
# local benchmark data — eval:* and benchmark:* scripts, OmniMemEval suites,
# summary/judge providers — stays local by design.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and package contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Package integrity
        run: npm run package:check
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Documentation contracts
        run: npm run docs:check
      - name: Agent context routes
        run: npm run agent:context:check
      - name: Dependency audit
        run: npm audit --production --audit-level=high

  tests:
    name: Product tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Product tests with coverage
        run: npm run test:coverage

  research-tests:
    name: Research characterization (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Research and benchmark adapter tests
        run: npm run test:research

  node-compat:
    name: Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: Build and type check
        run: npm run build && npm run check
      - name: Package integrity
        run: npm run package:check

  chaos:
    name: Windows chaos tests
    # These reproduce Windows-specific EPERM file pins and WAL locking. One
    # supported runtime is enough here; Node compatibility is checked above.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Chaos tests (Windows)
        env:
          NMG_DAEMON_READY_TIMEOUT_MS: "60000"
        run: npm run test:chaos

  all-checks-passed:
    name: All checks passed
    if: ${{ always() }}
    needs: [static, tests, node-compat, chaos]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          NODE_COMPAT_RESULT: ${{ needs.node-compat.result }}
          CHAOS_RESULT: ${{ needs.chaos.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$NODE_COMPAT_RESULT" = success
          test "$CHAOS_RESULT" = success
