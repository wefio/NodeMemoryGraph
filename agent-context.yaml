version: 1

capabilities:
  - id: memory-runtime
    aliases: [memory-daemon, durable-memory]
    summary: Run the local-first NMG daemon and its durable memory, session AG, and Task Board surfaces.
    paths: [src/cli, src/core, src/integration]
    entrypoints: [nmg daemon start, nmg search, nmg remember]
    supports: [remember, search, get, session-active-graph, task-board]

  - id: harness-adapters
    aliases: [agent-integration]
    summary: Connect the shared Agent Surface to Pi, Claude MCP, WorkBuddy, or DSH without moving product policy into an adapter.
    paths: [extensions, claude-plugins, workbuddy-plugin, dsh]
    entrypoints: [npm install node-memory-graph]
    supports: [pi, claude-mcp, workbuddy, dsh]

  - id: retrieval-evaluation
    aliases: [evidence-recall, retrieval-benchmark]
    summary: Run deterministic rank-aware evidence retrieval evaluation without an answer model or judge.
    paths: [evals/retrieval, tests/evals]
    entrypoints: [npm run eval:retrieval]
    supports: [locomo, longmemeval, beam, personamem, halumem]

  - id: official-memory-benchmarks
    aliases: [omnimemeval]
    summary: Run the pinned official OmniMemEval answer and judge pipelines through the NMG adapter.
    paths: [evals/omnimemeval, evals/official]
    entrypoints: [npm run benchmark:omni]
    supports: [locomo, longmemeval, beam, personamem-v2, halumem]

  - id: repository-control-plane
    aliases: [rcp, repository-reconciliation]
    summary: Reconcile declared repository changes through scoped execution, verification, receipts, and forge state.
    paths: [src/rcp, bin/nmg-rcp.mjs]
    entrypoints: [nmg-rcp reconcile]
    supports: [contract-compile, plan, reconcile, verify, local-receipts, forge-observation]

routes:
  - id: core-store
    paths: [src/core/store/**]
    owners:
      - docs/design/design.md
      - docs/design/store-cluster-split.md
      - docs/design/sqlite-assessment.md
    tests: [tests/core/store/**]
    verify:
      blocking: [check, test:product, build]
      advisory: []

  - id: core-memory
    paths: [src/core/**]
    owners:
      - docs/design/design.md
      - docs/design/memory-graphs.md
    tests: [tests/core/**]
    verify:
      blocking: [check, test:product, build]
      advisory: []

  - id: daemon-cli
    paths: [src/cli/**, bin/**, proto/**]
    owners:
      - docs/design/design.md
      - docs/design/daemon-lifecycle-design.md
    tests: [tests/cli/**, tests/chaos/**]
    verify:
      blocking: [build, test:product]
      advisory: [test:chaos]

  - id: pi-adapter
    paths: [extensions/**, .pi/extensions/**]
    owners:
      - README.md
      - docs/design/session-memory-lifecycle-hooks-2026-08-10.md
      - docs/design/tiered-disclosure-design.md
    tests: [tests/extensions/**, tests/integration/**]
    verify:
      blocking: [check, test:product, build]
      advisory: []

  - id: dsh-adapter
    paths: [dsh/**]
    owners:
      - dsh/README.md
      - skills/nmg-memory/references/harness-adapters.md
    tests: []
    verify:
      blocking: [check]
      advisory: []

  - id: claude-adapter
    paths: [claude-plugins/**]
    owners:
      - README.md
      - skills/nmg-memory/references/harness-adapters.md
    tests: [tests/integration/claude-mcp.test.ts]
    verify:
      blocking: [check, test:product, build]
      advisory: []

  - id: workbuddy-adapter
    paths: [workbuddy-plugin/**]
    owners:
      - workbuddy-plugin/README.md
      - skills/nmg-memory/references/harness-adapters.md
    tests: [tests/integration/workbuddy-hook.test.ts]
    verify:
      blocking: [check, test:product, build, package:check]
      advisory: []

  - id: documentation
    paths: [docs/**, skills/**, README.md, README.zh-CN.md]
    owners:
      - docs/README.md
      - skills/doc-maintenance/SKILL.md
    tests: [tests/docs/**, tests/skills/**]
    verify:
      blocking: [docs:check, glossary:check]
      advisory: []

  - id: evaluation
    paths: [evals/**, tests/evals/**, tests/benchmarks/**, tests/official/**]
    owners:
      - docs/experiments/benchmark-results.md
      - docs/design/completion-audit.md
    tests: [tests/evals/**, tests/benchmarks/**, tests/official/**]
    verify:
      blocking: [check]
      advisory: [test:research]

  - id: ci-and-tests
    paths: [tests/**, .github/**, scripts/verify-docs.mts, package.json]
    owners:
      - docs/design/ci-cd-and-quality.md
      - docs/README.md
      - skills/repo-development/SKILL.md
    tests: [tests/**]
    verify:
      blocking: [verify:static, test:product]
      advisory: [verify:research, verify:chaos]

  - id: packaging
    paths: [package.json, package-lock.json, tsconfig.build.json, bin/**]
    owners:
      - docs/design/ci-cd-and-quality.md
      - docs/design/design.md
      - skills/repo-development/references/builds.md
    tests: [tests/extensions/pi-dependency-boundary.test.ts]
    verify:
      blocking: [build, package:check]
      advisory: []

  - id: repository-tooling
    paths: [tools/**, scripts/**, AGENTS.md, agent-context.yaml, tsconfig.json, .gitignore]
    owners:
      - docs/design/ci-cd-and-quality.md
      - docs/README.md
    tests: [tests/tools/**, tests/scripts/**, tests/docs/**]
    verify:
      blocking: [check, test:product, build, agent:context:check]
      advisory: []
      # `.gitignore` is a declaration, not code: the always-run shared checks can all pass or fail
      # identically whether or not it changed, and the one check that reads it (the complexity
      # gate's probe scratch must stay invisible to git) lives in this route's own tests.
      sharedChecks: none

  - id: repository-control-plane
    paths: [src/rcp/**, tests/rcp/**, bin/nmg-rcp.mjs]
    owners:
      - docs/design/ci-cd-and-quality.md
      - docs/decisions/implemented/2026-08-29-repository-control-plane.md
      - skills/repo-development/references/control-plane.md
    tests: [tests/rcp/**]
    verify:
      blocking: [check, test:product, build, package:check]
      advisory: []

  # The integration layer is split by owner document, not by directory: the Agent Surface
  # presents, and the OoO/task files orchestrate. Both list files because `matches()` in
  # tools/repo-context.ts reads the first `*` as a directory prefix, so only `dir/**` and exact
  # paths match - `src/integration/ooo-*.ts` would match nothing and stay silently unrouted.
  - id: agent-surface
    paths:
      - src/integration/agent-surface.ts
      - src/integration/chain-projection.ts
      - src/integration/config.ts
      - src/integration/controller-channel.ts
      - src/integration/evidence.ts
      - src/integration/lab-capabilities.ts
      - src/integration/reasoning-workspaces.ts
      - src/integration/search-projection.ts
      - src/integration/search.ts
      - src/integration/tool-contract.ts
    owners:
      - docs/design/design.md
    tests: [tests/integration/agent-surface.test.ts, tests/integration/chain-projection.test.ts, tests/integration/config.test.ts, tests/integration/controller-channel.test.ts, tests/integration/evidence.test.ts, tests/integration/lab-capabilities.test.ts, tests/integration/tool-contract.test.ts]
    verify:
      blocking: [check, test:product, build]
      advisory: []

  - id: ooo-execution
    paths:
      - src/integration/ooo-board.ts
      - src/integration/ooo-candidate.ts
      - src/integration/ooo-execution.ts
      - src/integration/ooo-fusion-plan.ts
      - src/integration/ooo-mutation.ts
      - src/integration/ooo-patch.ts
      - src/integration/check-ticket.ts
      - src/integration/check-runner.ts
      - src/integration/ooo-session-facts.ts
      - src/integration/task-advisers.ts
      - src/integration/task-coordinator.ts
      - src/integration/task-semantics-interleavings.ts
      - src/integration/task-semantics-model.ts
      - src/integration/task-semantics.ts
    owners:
      - docs/design/ooo-execution-bootstrap.md
      - docs/design/task-unit-semantics.md
      - docs/design/ooo-fusion-planning.md
    tests: [tests/integration/ooo-*.test.ts, tests/integration/task-semantics*.test.ts]
    verify:
      blocking: [check, test:product, build]
      advisory: []

  # The third thing under this layer: retrieval-index text that an external LLM writes and the
  # LLM-free store persists. It is neither the Agent Surface nor the execution orchestra, so it owns
  # a route instead of borrowing either owner's documents.
  - id: retrieval-enrichment
    paths:
      - src/integration/leaf-summarizer.ts
      - src/integration/node-summarizer.ts
      - src/integration/summary-drain.ts
      - src/integration/openai-completion.ts
    owners:
      - docs/design/design.md
      - docs/design/tiered-disclosure-design.md
    tests: [tests/integration/leaf-summarizer.test.ts, tests/integration/summary-drain.test.ts, tests/core/store/node-summaries.test.ts]
    verify:
      blocking: [check, test:product, build]
      advisory: []
