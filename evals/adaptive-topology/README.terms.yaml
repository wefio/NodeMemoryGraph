version: 2
terms:
  - term: adaptive topology ablation
    aliases: [eval:adaptive, 自适应拓扑消融]
    definition: >-
      The deterministic held-out relation and routing experiment in which each case creates two semantically orthogonal nodes, the query identifies only the entry node while the required evidence lives in the other node, and the run compares flat retrieval, a fixed unlinked graph and an accepted co-retrieval proposal, plus the heuristic router before labels against the framework-independent online router after explicit useful-node labels; the command fails unless adaptive graph recall beats the fixed graph, labelled routing beats the heuristic route, and proposal precision is 100% on the controlled workload.
      确定性留出关系与路由实验：每个 case 创建两个语义正交的节点，查询只标识入口节点而所需证据在另一个节点里，运行比较扁平检索、固定无链接图与一个被接受的共同检索提议，并比较标签之前的启发式路由器与显式有用节点标签之后的框架无关在线路由器；除非自适应图召回优于固定图、带标签路由优于启发式路由、且受控负载上提议精确率为 100%，该命令失败。
    owner: evals/adaptive-topology/README.md
    anchor: Adaptive topology ablation
    status: canonical
  - term: held-out relation case
    aliases: [co-retrieval proposal, 留出关系 case]
    definition: >-
      A constructed case whose extreme separation is intentional: each held-out case requires exactly the relation supplied by repeated useful co-retrieval labels, so the 2026-07-19 local 30-case run (flat/fixed/adaptive recall 0%/0%/100%, heuristic/labelled routing accuracy 0%/100%, 100% proposal precision, P50 retrieval latency about 0.36/0.78/1.10 ms) is a mechanism/ablation result, not a claim about natural conversation quality.
      刻意构造出极端分离的 case：每个留出 case 恰好需要由重复的有用共同检索标签所提供的那条关系，因此 2026-07-19 的本地 30 case 运行（扁平／固定／自适应召回 0%/0%/100%、启发式／带标签路由准确率 0%/100%、100% 提议精确率、P50 检索延迟约 0.36/0.78/1.10 ms）是机制／消融结果，不是关于自然对话质量的声称。
    owner: evals/adaptive-topology/README.md
    anchor: Adaptive topology ablation
    status: canonical
