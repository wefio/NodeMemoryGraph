# NMG write-reminder hooks for Kimi Code CLI.
# Append these two blocks to ~/.kimi-code/config.toml and fix the paths.
# Windows: quote the path; Kimi runs hook commands via cmd.exe.
# PostToolUse is observational (its output is discarded), so the git-commit
# nudge hooks PreToolUse — a flow-affecting event whose stdout reaches context.

[[hooks]]
event = "UserPromptSubmit"
command = "node \"C:/Documents/GitHub/NodeMemoryGraph/kimi-plugin/nmg-hook.mjs\""
timeout = 5

[[hooks]]
event = "PreToolUse"
matcher = "Bash"
command = "node \"C:/Documents/GitHub/NodeMemoryGraph/kimi-plugin/nmg-hook.mjs\""
timeout = 5
