version: 2
terms:
  - term: one-off script
    aliases: [一次性脚本, ad-hoc script]
    definition: >-
      A disposable task-specific entry point for one question or analysis. An entry point that other work depends on rerunning is maintained at its owner instead; a shared helper requires an actual second consumer.
      用于一个问题或一次分析的可丢弃任务入口。其他工作依赖重跑的入口由其 owner 维护；共享辅助函数需要实际的第二个调用方。
    owner: skills/script-reuse/SKILL.md
    anchor: Write the one-off script, and write it right
    status: canonical
  - term: self-check
    aliases: [结果自检]
    definition: >-
      An assertion about a script's measured result that fails the run when the expected invariant is false; successful execution alone is not evidence of correctness.
      对脚本测量结果作出的断言；预期不变量不成立时必须使运行失败。仅仅执行成功不是正确性的证据。
    owner: skills/script-reuse/SKILL.md
    anchor: What makes it right
    status: canonical
