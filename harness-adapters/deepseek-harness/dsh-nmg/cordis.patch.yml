# dsh-nmg bundle patch: inserts the dual-face plugin row into the web profile.
# Applied as a profile bundle layer (`dsh.bundle.patch` manifest field); install with
#   dsh plugin --profile web add link:C:/Documents/GitHub/NodeMemoryGraph/harness-adapters/deepseek-harness/dsh-nmg
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (tools + automatic recall over daemon JSON-RPC), and the
# `dsh.client` declaration in package.json makes the browser half (exports
# "./client", served at /plugins/@nmg/dsh-nmg/client.js) load in the web GUI
# (the tool.call.toolview cards).
- insert:
    - id: nmg
      name: '@nmg/dsh-nmg'
